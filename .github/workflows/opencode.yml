name: OpenCode + OmniRoute (Auto)

on:
  workflow_dispatch:
    inputs:
      instruccion:
        description: '💬 Instrucción para OpenCode'
        required: true
        type: string
        default: 'Revisa la estructura del proyecto y sugiere el siguiente paso'

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      # ============================================================
      # PASO 1: Clonar repositorio
      # ============================================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # PASO 2: Configurar Node.js y Git
      # ============================================================
      - name: 🟢 Setup Node.js & Git
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⚙️ Setup Git Identity
        run: |
          git config --global user.name "OpenCode Bot"
          git config --global user.email "opencode@farmaclinica.local"

      # ============================================================
      # PASO 3: Instalar OpenCode y OmniRoute
      # ============================================================
      - name: 📦 Install CLI Tools
        run: |
          npm install -g opencode-ai omniroute
          echo "✅ OpenCode y OmniRoute instalados correctamente"

      # ============================================================
      # PASO 4: Iniciar servicio OmniRoute en modo AUTO
      # ============================================================
      - name: 🚀 Start OmniRoute Service (Auto Mode)
        env:
          # Al estar en automático, pásale todos los tokens disponibles 
          # OmniRoute decidirá cuál usar en cada momento para ahorrar costos/mejorar lógica
          VTOSS_API_KEY: ${{ secrets.VTOSS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Iniciamos el proxy activando el modo AUTO y la compresión
          omniroute start --port 8080 --mode auto --compression true &
          
          echo "⏳ Levantando motor de enrutamiento automático..."
          sleep 4
          echo "✅ OmniRoute activo en modo AUTO y escuchando en http://localhost:8080/v1"

      # ============================================================
      # PASO 5: Cargar / Estructurar Contexto del Proyecto
      # ============================================================
      - name: 📖 Prepare Context & Directories
        run: |
          mkdir -p .opencode/prompts
          mkdir -p .opencode/sessions

          if [ ! -f ".opencode/current_context.md" ]; then
            cat > .opencode/current_context.md << 'EOF'
          # Estado actual del proyecto

          ## 🎯 Objetivo general
          App Android para inventario de Farmaclinica Verde.

          ## 📝 Siguiente tarea pendiente
          Definir la estructura base del proyecto Android.

          ## 📂 Archivos clave
          - (Pendiente de inicializar)

          ## 🧠 Notas Técnicas
          - Usar Material Design para la interfaz.
          - Sincronización de base de datos (SQLite local / Firebase).
          EOF
            echo "✅ Archivo de contexto inicial generado."
          fi

      # ============================================================
      # PASO 6: Ejecutar OpenCode ruteado por OmniRoute
      # ============================================================
      - name: 🤖 Run OpenCode via OmniRoute
        env:
          # Apuntamos el SDK subyacente hacia nuestro proxy local
          OPENAI_BASE_URL: "http://localhost:8080/v1"
          OPENAI_API_KEY: "omniroute-local-key"
          # Pasamos el input de forma segura a través del entorno
          INSTRUCCION_USUARIO: ${{ github.event.inputs.instruccion }}
        run: |
          echo "============================================================"
          echo "🤖 EJECUTANDO OPENCODE EN MODO AUTO"
          echo "============================================================"

          CONTEXTO=$(cat .opencode/current_context.md 2>/dev/null || echo "Sin contexto.")
          HISTORIAL=$(cat .opencode/prompts/historial-completo.md 2>/dev/null || echo "Sin historial.")

          export PROMPT_FINAL="INSTRUCCIÓN DEL USUARIO:
          $INSTRUCCION_USUARIO

          CONTEXTO ACTUAL DEL PROYECTO:
          $CONTEXTO

          HISTORIAL DE INSTRUCCIONES:
          $HISTORIAL

          TAREAS OBLIGATORIAS AL FINALIZAR:
          1. ACTUALIZA el archivo .opencode/current_context.md con el nuevo estado del proyecto.
          2. AÑADE un resumen de esta sesión en .opencode/prompts/historial-completo.md."

          opencode run "$PROMPT_FINAL"

      # ============================================================
      # PASO 7: Guardar estado y hacer Commit en Git
      # ============================================================
      - name: 💾 Commit and Push Changes
        env:
          INSTRUCCION_USUARIO: ${{ github.event.inputs.instruccion }}
        run: |
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M')
          SESSION_FILE=".opencode/sessions/$(date '+%Y-%m-%d_%H-%M')_session.md"

          # Añadir registro rápido al historial
          echo -e "\n## $TIMESTAMP\n**Instrucción:** $INSTRUCCION_USUARIO\n" >> .opencode/prompts/historial-completo.md

          # Crear archivo de sesión detallado
          cat > "$SESSION_FILE" << EOF
          # Sesión del $TIMESTAMP

          ## 📝 Instrucción recibida
          $INSTRUCCION_USUARIO

          ## 📂 Archivos modificados
          $(git status --porcelain 2>/dev/null || echo "Sin cambios")

          ## ✅ Estado final
          Fecha de finalización: $(date '+%Y-%m-%d %H:%M:%S')
          EOF

          # Preparar commit
          git add .
          
          if git diff --staged --quiet; then
            echo "ℹ️ La IA no generó cambios en el código en esta ejecución."
          else
            git commit -m "🧠 [OpenCode] Sesión $TIMESTAMP - $INSTRUCCION_USUARIO"
            git push
            echo "✅ Código autogenerado subido con éxito a la rama actual."
          fi
