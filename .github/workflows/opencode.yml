name: opencode

on:
  workflow_dispatch:
    inputs:
      instruccion:
        description: '💬 Tu instrucción para OpenCode (ej: "Crea la pantalla de login")'
        required: true
        type: string
        default: 'Continúa con el proyecto. Lee el contexto en .opencode/current_context.md'

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      # ============================================================
      # PASO 1: Clonar el repositorio
      # ============================================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # PASO 2: Instalar Node.js
      # ============================================================
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ============================================================
      # PASO 3: Instalar OpenCode + OmniRoute
      # ============================================================
      - name: 📦 Install OpenCode and OmniRoute
        run: npm install -g opencode-ai omniroute

      # ============================================================
      # PASO 4: Iniciar OmniRoute y configurar OpenCode
      # ============================================================
      - name: 🚀 Start OmniRoute and configure OpenCode
        run: |
          # Iniciar OmniRoute en segundo plano
          omniroute &
          sleep 5

          # Configurar OpenCode para usar OmniRoute (con guiones, no camelCase)
          omniroute config opencode \
            --base-url http://localhost:20128 \
            --api-key "sk_omniroute"

          echo "✅ OmniRoute configurado correctamente"

      # ============================================================
      # PASO 5: Cargar y mostrar el contexto actual
      # ============================================================
      - name: 📖 Load current context
        run: |
          echo "============================================================"
          echo "📖 CONTEXTO ACTUAL DEL PROYECTO"
          echo "============================================================"
          if [ -f ".opencode/current_context.md" ]; then
            cat .opencode/current_context.md
          else
            echo "⚠️ No hay contexto previo. Creando estructura inicial..."
            mkdir -p .opencode/prompts
            mkdir -p .opencode/sessions
            echo "# Estado actual del proyecto" > .opencode/current_context.md
            echo "## 🎯 Objetivo general" >> .opencode/current_context.md
            echo "App Android para inventario de farmacia." >> .opencode/current_context.md
            echo "" >> .opencode/current_context.md
            echo "## 📝 Siguiente tarea pendiente" >> .opencode/current_context.md
            echo "Definir la estructura del proyecto." >> .opencode/current_context.md
          fi
          echo "============================================================"

      # ============================================================
      # PASO 6: Ejecutar OpenCode con la instrucción y contexto
      # ============================================================
      - name: 🤖 Run OpenCode with context
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: auto
          prompt: |
            ============================================================
            INSTRUCCIÓN DEL USUARIO
            ============================================================
            ${{ github.event.inputs.instruccion }}

            ============================================================
            CONTEXTO ACTUAL DEL PROYECTO (lee esto para saber dónde estás)
            ============================================================
            $(cat .opencode/current_context.md 2>/dev/null || echo "Sin contexto previo.")

            ============================================================
            HISTORIAL DE INSTRUCCIONES (para entender el progreso)
            ============================================================
            $(cat .opencode/prompts/historial-completo.md 2>/dev/null || echo "Sin historial previo.")

            ============================================================
            TAREAS OBLIGATORIAS AL FINALIZAR
            ============================================================
            1. ACTUALIZA .opencode/current_context.md con el NUEVO estado del proyecto.
            2. AÑADE esta instrucción al historial en .opencode/prompts/historial-completo.md (con fecha y hora).
            3. Si creaste o modificaste archivos, asegúrate de que queden guardados.

      # ============================================================
      # PASO 7: Guardar el estado actualizado (contexto + historial)
      # ============================================================
      - name: 💾 Save session state
        run: |
          # Crear carpetas si no existen
          mkdir -p .opencode/sessions
          mkdir -p .opencode/prompts

          # Guardar la instrucción en el historial
          echo "## $(date '+%Y-%m-%d %H:%M') - Sesión" >> .opencode/prompts/historial-completo.md
          echo "${{ github.event.inputs.instruccion }}" >> .opencode/prompts/historial-completo.md
          echo "" >> .opencode/prompts/historial-completo.md

          # Guardar resumen de la sesión en un archivo separado
          SESSION_FILE=".opencode/sessions/$(date '+%Y-%m-%d_%H-%M')_session.md"
          echo "# Sesión del $(date '+%Y-%m-%d %H:%M')" > $SESSION_FILE
          echo "" >> $SESSION_FILE
          echo "## 📝 Instrucción recibida" >> $SESSION_FILE
          echo "${{ github.event.inputs.instruccion }}" >> $SESSION_FILE
          echo "" >> $SESSION_FILE
          echo "## 📂 Archivos modificados en esta sesión" >> $SESSION_FILE
          git status --porcelain >> $SESSION_FILE 2>/dev/null || echo "Sin cambios"
          echo "" >> $SESSION_FILE
          echo "## ✅ Estado final" >> $SESSION_FILE
          echo "Fecha: $(date '+%Y-%m-%d %H:%M:%S')" >> $SESSION_FILE

          # Configurar usuario de git para el commit
          git config user.name "OpenCode Bot"
          git config user.email "opencode@pharmatools.local"

          # Hacer commit de todos los cambios (código + contexto)
          git add .opencode/ . || true
          git add . || true
          git commit -m "🧠 [OpenCode] Sesión $(date '+%Y-%m-%d %H:%M') - ${{ github.event.inputs.instruccion }}" || echo "✅ No hay cambios nuevos para commit"
          git push || echo "⚠️ Error al hacer push (puede ser normal si no hay cambios)"

          echo ""
          echo "============================================================"
          echo "📋 RESUMEN DE LA SESIÓN"
          echo "============================================================"
          echo "📂 Sesión guardada en: .opencode/sessions/$(date '+%Y-%m-%d_%H-%M')_session.md"
          echo "📝 Historial actualizado: .opencode/prompts/historial-completo.md"
          echo "📖 Contexto actual: .opencode/current_context.md"
          echo "✅ Estado guardado correctamente"
          echo "============================================================"

      # ============================================================
      # PASO 8: Finalizar y mostrar resumen
      # ============================================================
      - name: ✅ Workflow completed
        run: |
          echo ""
          echo "============================================================"
          echo "🎉 TRABAJO COMPLETADO CON ÉXITO"
          echo "============================================================"
          echo "📂 Los cambios están en tu repositorio:"
          echo "   https://github.com/${{ github.repository }}"
          echo ""
          echo "📱 La APK se compilará AUTOMÁTICAMENTE si hay cambios en 'main'"
          echo "   (gracias al workflow de build que ya tienes)"
          echo ""
          echo "📖 Para continuar en la próxima sesión:"
          echo "   1. Ejecuta este workflow nuevamente"
          echo "   2. Escribe tu nueva instrucción"
          echo "   3. OpenCode leerá el contexto guardado y continuará"
          echo "============================================================"