name: opencode

on:
  workflow_dispatch:
    inputs:
      instruccion:
        description: 'Instrucción para OpenCode (ej: "Crea una función de login")'
        required: true
        type: string
        default: 'Hola, responde con un saludo y confirma que estás funcionando.'
  issue_comment:
    types: [created]

jobs:
  opencode:
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OpenCode with OmniRoute
        uses: anomalyco/opencode/github@latest
        env:
          # Usa PAT_TOKEN si existe (para comentarios), si no, usa GITHUB_TOKEN (automático)
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          model: auto
          # Si es manual, usa el input; si es por comentario, OpenCode usa el cuerpo del comentario
          prompt: ${{ github.event.inputs.instruccion || '' }}