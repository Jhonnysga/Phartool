name: opencode

on:
  workflow_dispatch:
    inputs:
      instruccion:
        description: '💬 Tu instrucción para OpenCode'
        required: true
        type: string
        default: 'Continúa con el proyecto'

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode + OmniRoute
        run: npm install -g opencode-ai omniroute

      - name: Start OmniRoute
        run: |
          omniroute &
          sleep 3
          omniroute config opencode --base-url http://localhost:20128
          echo "✅ OmniRoute corriendo"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: auto
          prompt: ${{ github.event.inputs.instruccion }}