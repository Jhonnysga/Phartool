name: Build Pharmatools Tag APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: ⬇️ Checkout del código
      uses: actions/checkout@v4

    - name: 🔧 Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 📦 Instalar Android SDK y herramientas
      run: |
        # Instalar sdkmanager si no está
        sudo apt update
        sudo apt install -y wget unzip
        # Si el SDK ya existe, solo actualizamos; si no, lo descargamos
        if [ ! -d /usr/local/lib/android/sdk ]; then
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          sudo mkdir -p /usr/local/lib/android/sdk/cmdline-tools
          sudo unzip /tmp/cmdline-tools.zip -d /usr/local/lib/android/sdk/cmdline-tools
          sudo mv /usr/local/lib/android/sdk/cmdline-tools/cmdline-tools /usr/local/lib/android/sdk/cmdline-tools/16.0
        fi
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH
        # Instalar paquetes necesarios
        yes | sdkmanager --licenses > /dev/null 2>&1
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0" "extras;google;m2repository" "extras;android;m2repository" > /dev/null 2>&1

    - name: ✅ Verificar SDK
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH
        sdkmanager --list | head -20

    - name: 🐍 Instalar Python y dependencias
      run: |
        sudo apt update
        sudo apt install -y python3 python3-pip
        pip3 install Pillow

    - name: 📁 Crear estructura del proyecto
      run: python3 build_pharmatools.py

    - name: 🔨 Generar Gradle Wrapper
      run: |
        cd PharmaTools_Inventario
        gradle wrapper --gradle-version 7.5

    - name: 🚀 Compilar APK
      run: |
        cd PharmaTools_Inventario
        chmod +x gradlew
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH
        ./gradlew assembleDebug --no-daemon

    - name: 📤 Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: Pharmatools-Tag-APK
        path: PharmaTools_Inventario/app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: 📊 Verificar APK
      run: |
        APK_PATH="PharmaTools_Inventario/app/build/outputs/apk/debug/app-debug.apk"
        if [ -f "$APK_PATH" ]; then
          echo "✅ APK generado exitosamente!"
          echo "📦 Tamaño: $(du -h $APK_PATH | cut -f1)"
        else
          echo "❌ Error: APK no encontrado"
          exit 1
        fi