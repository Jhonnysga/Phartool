name: Build Pharmatools Tag APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: ⬇️ Checkout
      uses: actions/checkout@v4

    - name: 🔧 Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: 📦 Instalar Android SDK
      run: |
        sudo apt update
        sudo apt install -y wget unzip curl
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
        sudo mkdir -p /usr/local/lib/android/sdk/cmdline-tools
        sudo unzip -q /tmp/cmdline-tools.zip -d /usr/local/lib/android/sdk/cmdline-tools
        sudo mv /usr/local/lib/android/sdk/cmdline-tools/cmdline-tools /usr/local/lib/android/sdk/cmdline-tools/16.0
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "PATH=$PATH:/usr/local/lib/android/sdk/cmdline-tools/16.0/bin:/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_ENV
        yes | /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager --licenses > /dev/null 2>&1 || true
        /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0" "extras;google;m2repository" "extras;android;m2repository" > /dev/null 2>&1

    - name: 🐍 Python y Pillow
      run: |
        sudo apt update
        sudo apt install -y python3 python3-pip
        pip3 install Pillow

    - name: 📥 Descargar dependencias de Google Play Services
      run: |
        echo "=== DESCARGANDO DEPENDENCIAS ==="
        mkdir -p app/libs
        cd app/libs
        
        # Descargar cada dependencia
        curl -L -o play-services-code-scanner.aar https://repo1.maven.org/maven2/com/google/android/gms/play-services-code-scanner/16.1.0/play-services-code-scanner-16.1.0.aar || \
        curl -L -o play-services-code-scanner.aar https://maven.google.com/com/google/android/gms/play-services-code-scanner/16.1.0/play-services-code-scanner-16.1.0.aar
        
        curl -L -o play-services-base.aar https://repo1.maven.org/maven2/com/google/android/gms/play-services-base/18.3.0/play-services-base-18.3.0.aar || \
        curl -L -o play-services-base.aar https://maven.google.com/com/google/android/gms/play-services-base/18.3.0/play-services-base-18.3.0.aar
        
        curl -L -o play-services-basement.aar https://repo1.maven.org/maven2/com/google/android/gms/play-services-basement/18.3.0/play-services-basement-18.3.0.aar || \
        curl -L -o play-services-basement.aar https://maven.google.com/com/google/android/gms/play-services-basement/18.3.0/play-services-basement-18.3.0.aar
        
        curl -L -o play-services-tasks.aar https://repo1.maven.org/maven2/com/google/android/gms/play-services-tasks/18.1.0/play-services-tasks-18.1.0.aar || \
        curl -L -o play-services-tasks.aar https://maven.google.com/com/google/android/gms/play-services-tasks/18.1.0/play-services-tasks-18.1.0.aar
        
        echo "=== VERIFICANDO DESCARGAS ==="
        ls -la
        echo "=== TAMAÑOS ==="
        du -h *.aar 2>/dev/null || echo "⚠️ No hay archivos AAR"

    - name: 📁 Generar proyecto con Python
      run: python3 build_pharmatools.py

    - name: ✅ Verificar AAR en el proyecto
      run: |
        echo "=== Contenido de app/libs ==="
        ls -la PharmaTools_Inventario/app/libs/
        echo "=== Tamaños ==="
        du -h PharmaTools_Inventario/app/libs/*.aar 2>/dev/null || echo "⚠️ No hay AAR"

    - name: ✅ Configurar Gradle Wrapper
      run: |
        cd PharmaTools_Inventario
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          wget -q https://github.com/gradle/gradle/raw/v7.5.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
        fi
        chmod +x gradlew

    - name: 🚀 Compilar APK
      run: |
        cd PharmaTools_Inventario
        ./gradlew clean assembleDebug --refresh-dependencies --no-build-cache --stacktrace
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: 📤 Subir APK
      uses: actions/upload-artifact@v4
      with:
        name: Pharmatools-Tag-APK
        path: PharmaTools_Inventario/app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: 📊 Verificar APK
      run: |
        APK="PharmaTools_Inventario/app/build/outputs/apk/debug/app-debug.apk"
        if [ -f "$APK" ]; then 
          echo "✅ APK generado exitosamente!"
          echo "📦 Tamaño: $(du -h $APK | cut -f1)"
        else 
          echo "❌ Error: APK no encontrado"
          exit 1
        fi