name: Build Pharmatools Tag APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: ⬇️ Checkout del código
      uses: actions/checkout@v4

    - name: 🔧 Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 📦 Instalar Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: |
          platform-tools
          platforms;android-33
          build-tools;33.0.0
          extras;google;m2repository
          extras;android;m2repository

    - name: ✅ Aceptar licencias de Android
      run: yes | sdkmanager --licenses

    - name: 🐍 Instalar Python y dependencias
      run: |
        sudo apt update
        sudo apt install -y python3 python3-pip
        pip3 install Pillow

    - name: 📁 Generar proyecto con Python
      run: python3 build_pharmatools.py

    - name: 🚀 Compilar APK con Gradle 7.5
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: 7.5
        arguments: assembleDebug
        build-root-directory: PharmaTools_Inventario

    - name: 📤 Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: Pharmatools-Tag-APK
        path: PharmaTools_Inventario/app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: 📊 Verificar APK
      run: |
        APK_PATH="PharmaTools_Inventario/app/build/outputs/apk/debug/app-debug.apk"
        if [ -f "$APK_PATH" ]; then
          echo "✅ APK generado exitosamente!"
          echo "📦 Tamaño: $(du -h $APK_PATH | cut -f1)"
        else
          echo "❌ Error: APK no encontrado"
          exit 1
        fi